<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert on Click</title>
</head>
<body>

  <a href="#" onclick="showAlert()">Click Me</a>

  <script>
    function showAlert() {
      alert("You clicked the link!");
    }
  </script>

</body>
</html>
