<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App - Asynchronous Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #1a2980;
            margin-bottom: 30px;
            font-size: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        h1 i {
            color: #26d0ce;
        }
        
        #form {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        #input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        #input:focus {
            outline: none;
            border-color: #26d0ce;
            box-shadow: 0 0 0 3px rgba(38, 208, 206, 0.2);
        }
        
        #form button {
            padding: 15px 30px;
            background: linear-gradient(to right, #1a2980, #26d0ce);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(38, 208, 206, 0.4);
        }
        
        #form button:active {
            transform: translateY(0);
        }
        
        .weather-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .weather-container.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .location {
            font-size: 1.8rem;
            color: #1a2980;
            font-weight: 700;
        }
        
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .temperature {
            font-size: 4rem;
            font-weight: 700;
            color: #26d0ce;
            position: relative;
        }
        
        .temperature::after {
            content: "°C";
            font-size: 1.5rem;
            position: absolute;
            top: 5px;
            right: -25px;
        }
        
        .weather-condition {
            text-align: center;
        }
        
        .condition-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a2980;
            margin-top: 10px;
        }
        
        .weather-icon {
            width: 100px;
            height: 100px;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .detail-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .detail-item:hover {
            transform: translateY(-5px);
            background: #e3f2fd;
        }
        
        .detail-label {
            display: block;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .detail-value {
            display: block;
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a2980;
        }
        
        .detail-item i {
            font-size: 2rem;
            color: #26d0ce;
            margin-bottom: 10px;
        }
        
        .error-message {
            background: #ffeaea;
            color: #d32f2f;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            border-left: 5px solid #d32f2f;
        }
        
        .error-message.active {
            display: block;
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #26d0ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .recent-searches {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .recent-searches h2 {
            color: #1a2980;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .search-item {
            background: #e3f2fd;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .search-item:hover {
            background: #bbdefb;
            transform: scale(1.05);
        }
        
        .github-section {
            margin-top: 40px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .github-section h2 {
            color: #1a2980;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .github-info {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .github-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #26d0ce;
        }
        
        .github-details h3 {
            color: #1a2980;
            margin-bottom: 5px;
        }
        
        .github-details p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .github-stats {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        .stat {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat i {
            color: #26d0ce;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            #form {
                flex-direction: column;
            }
            
            .weather-main {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            
            .temperature {
                font-size: 3rem;
            }
            
            .weather-details {
                grid-template-columns: 1fr;
            }
            
            .github-info {
                flex-direction: column;
                text-align: center;
            }
            
            .github-stats {
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-cloud-sun"></i> Weather App - Async Demo</h1>
        
        <form id="form">
            <input type="text" placeholder="Enter city name (e.g., London, Karachi, Tokyo)" id="input">
            <button type="submit"><i class="fas fa-search"></i> Search</button>
        </form>
        
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">An error occurred. Please try again.</span>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>
        
        <div class="weather-container" id="weatherContainer">
            <div class="weather-header">
                <h2 class="location" id="location">--</h2>
                <div class="local-time" id="localTime">--</div>
            </div>
            
            <div class="weather-main">
                <div class="temperature-section">
                    <div class="temperature" id="temperature">--</div>
                    <div class="feels-like">Feels like: <span id="feelsLike">--</span>°C</div>
                </div>
                
                <div class="weather-condition">
                    <img class="weather-icon" id="weatherIcon" src="" alt="Weather icon">
                    <div class="condition-text" id="conditionText">--</div>
                </div>
            </div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <i class="fas fa-tint"></i>
                    <span class="detail-label">Humidity</span>
                    <span class="detail-value" id="humidity">--%</span>
                </div>
                
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <span class="detail-label">Wind Speed</span>
                    <span class="detail-value" id="windSpeed">-- km/h</span>
                </div>
                
                <div class="detail-item">
                    <i class="fas fa-compress-alt"></i>
                    <span class="detail-label">Pressure</span>
                    <span class="detail-value" id="pressure">-- mb</span>
                </div>
                
                <div class="detail-item">
                    <i class="fas fa-eye"></i>
                    <span class="detail-label">Visibility</span>
                    <span class="detail-value" id="visibility">-- km</span>
                </div>
            </div>
        </div>
        
        <div class="recent-searches" id="recentSearches">
            <h2><i class="fas fa-history"></i> Recent Searches</h2>
            <div class="search-items" id="searchItems">
                <!-- Recent searches will be added here -->
            </div>
        </div>
        
        <div class="github-section" id="githubSection">
            <h2><i class="fab fa-github"></i> GitHub Profile</h2>
            <div class="github-info" id="githubInfo">
                <!-- GitHub info will be loaded here -->
            </div>
        </div>
    </div>

    <script src="./async.js"></script>
</body>
</html>
